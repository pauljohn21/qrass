<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="rxrust source analysis plugin logo">
  <rect width="128" height="128" rx="26" fill="#0b1020"/>

  <!-- three pushed streams: source emits, operators wrap, terminal collects -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 34h68" stroke="#22d3ee" stroke-width="4" opacity="0.9"/>
    <path d="M30 64h68" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
    <path d="M30 94h68" stroke="#818cf8" stroke-width="4" opacity="0.5"/>

    <!-- chevrons = push direction (no pull in rxrust) -->
    <g stroke="#e0f2fe" stroke-width="4">
      <path d="M56 27l8 7-8 7"/>
      <path d="M80 27l8 7-8 7"/>
      <path d="M56 57l8 7-8 7"/>
      <path d="M80 57l8 7-8 7"/>
      <path d="M56 87l8 7-8 7"/>
      <path d="M80 87l8 7-8 7"/>
    </g>
  </g>

  <!-- source node -->
  <circle cx="20" cy="64" r="9" fill="#a78bfa"/>
  <!-- terminal observer / collection point -->
  <rect x="101" y="55" width="18" height="18" rx="4" fill="none" stroke="#f59e0b" stroke-width="4"/>
</svg>
