# Active project context — constraints an agent cannot infer by reading code alone.
context: |
  RFP style contract (capability `rfp-style-contract`, OpenSpec change
  `refactor-rfp-strict`) is IN EFFECT for every change from approval onward: all
  `crates/qrass/src` code MUST express iteration / state-transition / batch-transform /
  stage-orchestration as rxrust Observable chains — no `for`/`while`/`loop`, no
  `if`/`else if` chains, and no multi guard-`return` stacking in a function body (fold to
  a single-exit `match`); synchronous-vs-async is never a reason to use std chains.
  Enforced by `tests/style_gate.rs` against `tests/golden/style-baseline.txt` (per-file,
  only-shrink ratchet). There is NO exemption list (R4 zero-exemption): the residual
  imperative constructs are an open conversion backlog in `tests/golden/style-exemptions.md`,
  each of which MUST be rewritten as an Observable chain; a construct that truly cannot
  be expressed is a blocking finding to escalate, never a waiver and never a std-chain
  fallback. New proposals/designs/tasks MUST account for this; regressions block the batch.

