[package]
name = "sasspile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A clean-room SCSS->CSS compiler whose control flow IS a lazy rxrust owned-value stream."

[dependencies]
rxrust = { version = "=1.0.0-rc.6", features = ["scheduler"] }
tracing = "0.1"
# The CSS named-colour keywords, as data. Their RGB values are Web-standard content, and the local corpus
# carries no complete name→RGB table (`values/colors/` holds only `alpha_hex/` and `equality.hrx`), so a
# dependency is auditable in a way my recollection is not. Linebender's actively maintained colour library
# is also where the coming rgb↔hsl / rgb↔hwb conversions will come from. Only its keyword→colour mapping
# is used — no printing behaviour — and `tests/color.rs` spot-checks the names the fixtures state.
color = "0.3"

[dev-dependencies]
ledger = { path = "../ledger" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-stdout = { version = "0.33.1", features = ["trace"] }
tracing-opentelemetry = "0.34.0"

[features]
# Gates the OpenTelemetry wiring in `tests/tracing_bridge.rs` (and `examples/trace_pipeline.rs`): with it,
# existing spans are bridged onto `opentelemetry-stdout` and printed as they end. The OTel crates are
# dev-dependencies, so they never reach the library; a dev-dependency cannot itself be optional, which is
# why this feature gates the *wiring* rather than stripping the compile.
trace = []

[lib]
name = "sasspile"
path = "src/lib.rs"
