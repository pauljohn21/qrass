[package]
name = "sasspile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A clean-room SCSS->CSS compiler whose control flow IS a lazy rxrust owned-value stream."

[dependencies]
rxrust = { version = "=1.0.0-rc.6", features = ["scheduler"] }
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
ledger = { path = "../ledger" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lib]
name = "sasspile"
path = "src/lib.rs"
