[package]
name = "sasspile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A clean-room SCSS->CSS compiler whose control flow IS a lazy rxrust owned-value stream."

[dependencies]
rxrust = "=1.0.0-rc.6"
tracing = "0.1"

[dev-dependencies]
ledger = { path = "../ledger" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
name = "sasspile"
path = "src/lib.rs"
