[package]
name = "ledger"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SQLite ledger for sass-spec A/B snapshots (replaces per-round reports/*.tsv sprawl)"

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Only ever compiled for `--features trace`; the OpenTelemetry bridge lets a CLI run print its own spans
# (see `trace_setup`). Unlike the compiler crate these are optional **normal** dependencies because a
# binary cannot see dev-dependencies.
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true }
opentelemetry-stdout = { version = "0.33.1", features = ["trace"], optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }

[features]
trace = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-stdout",
  "dep:tracing-opentelemetry",
]
