[package]
name = "docsizer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Read-only accounting for the write-rxrust-from-scratch tutorial: teachable-line inventory, lesson coverage, and non-code word counts."

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "docsizer"
path = "src/main.rs"
