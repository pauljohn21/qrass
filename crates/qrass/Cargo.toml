[package]
name = "qrass"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rxrust = "=1.0.0-rc.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrass-macros = { path = "../qrass-macros" }

[lib]
name = "qrass"
path = "src/lib.rs"

[[bin]]
name = "qrass"
path = "src/main.rs"

[dev-dependencies]
lightningcss = "1.0.0-alpha.72"
