[package]
name = "qrass-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "qrass_wasm"
path = "src/lib.rs"
# cdylib produces the browser-facing .wasm; rlib keeps host-side #[test]s able
# to call the same functions directly (wasm-bindgen shims compile to identity
# off the wasm target).
crate-type = ["cdylib", "rlib"]

[dependencies]
qrass = { path = "../qrass" }
wasm-bindgen = "0.2"
