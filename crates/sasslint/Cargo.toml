[package]
name = "sasslint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic iron-rule linter for sasspile: flags tree/recursion/relay-Vec/string-machine patterns that violate the rxrust-owned-stream doctrine."

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `--features trace` only: bridges the CLI's `sasslint` span onto OpenTelemetry and prints it via
# `opentelemetry-stdout` (no collector, no network). Optional normal dependencies, because a binary cannot
# see dev-dependencies.
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry_sdk = { version = "0.33.1", optional = true }
opentelemetry-stdout = { version = "0.33.1", features = ["trace"], optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }

[features]
trace = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-stdout",
  "dep:tracing-opentelemetry",
]

[lib]
name = "sasslint"
path = "src/lib.rs"

[[bin]]
name = "sasslint"
path = "src/main.rs"

[[bin]]
name = "sasslint-mcp"
path = "src/mcp.rs"
