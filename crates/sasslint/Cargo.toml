[package]
name = "sasslint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic iron-rule linter for sasspile: flags tree/recursion/relay-Vec/string-machine patterns that violate the rxrust-owned-stream doctrine."

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sasslint"
path = "src/lib.rs"

[[bin]]
name = "sasslint"
path = "src/main.rs"

[[bin]]
name = "sasslint-mcp"
path = "src/mcp.rs"
